# The three static libraries an embedding app links, built and published.
#
# ServerBox carries this fork as a submodule and links `libish.a`,
# `libish_emu.a` and `libfakefs.a` into its iOS app. Building them there means
# every CI run and every fresh clone installs llvm, lld, meson, ninja and
# libarchive first — hundreds of megabytes for output that only changes when
# this repository does.
#
# The release is tagged `vX.Y.Z`, one per commit on the default branch — a
# gitlink may point at any of them. It used to be tagged `libs-<sha>`, which a
# consumer could derive from the gitlink and nothing else; the cost was a
# releases page where every entry was a hash and GitHub had no way to order
# them, so the "Latest" badge sat on whichever release happened to be marked
# and stayed there. The name is now readable and orderable, and the mapping
# back to a revision is a question the consumer asks its own checkout: the tag
# is on the commit, so `git tag --points-at HEAD` answers it offline. See
# `scripts/ensure-ish-libs.sh` in ServerBox.
#
# The version follows the same rule as the `gtp` shell function: the patch
# number carries the count of commits since the previous tag, so the distance
# between two releases is legible from their names.
#
# Do not go back to tagging with a bare sha. GitHub refuses a tag of 40 or 64
# hex characters outright — it would be indistinguishable from a commit — and
# the refusal arrives from the pre-receive hook after the assets have already
# uploaded, so the run fails having left a release behind that was never
# published. That is what the old `libs-` prefix was for.
name: Static libraries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialised, because two runs would read the same "last tag" and compute the
# same next one. The second would then be publishing over the first's release.
concurrency:
  group: static-libs
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The whole history and every tag: the version below is derived from
          # the last tag and the distance to it, and the default shallow
          # checkout has neither.
          fetch-depth: 0

      - name: Next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # By version rather than by when the tag was made, which is what "the
          # last one" has to mean for names that sort.
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"

          if [ -z "$latest" ]; then
            # Upstream's own tags are `builds/beta/N` and `builds/*/N`, so there
            # is no series here to continue, and `gtp`'s fallback — the count of
            # commits since the beginning of history — would be a five-figure
            # patch number on a repository this old. Start one instead.
            tag=v1.0.0
          else
            IFS=. read -r major minor patch <<<"${latest#v}"
            # Every commit in the range, not the first-parent walk, which is
            # what `gtp` counts. A pull request merged rather than squashed
            # therefore moves the patch number by its own length — five commits
            # in and the next tag is five further on. That is the count meaning
            # what it says; it is not a run that was skipped.
            count="$(git rev-list --count "$latest..HEAD")"
            if [ "$count" -eq 0 ]; then
              # A re-run of `workflow_dispatch` on a commit already tagged.
              # Publishing over the existing release is what is wanted; a fresh
              # tag for the same commit is not.
              tag="$latest"
            else
              tag="v$major.$minor.$((patch + count))"
            fi
          fi

          echo "note: $latest -> $tag for ${GITHUB_SHA}" >&2
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Install build tools
        run: brew install llvm lld ninja libarchive meson

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          # Device and simulator are the same architecture as the runner, which
          # is the point of this fork: the gadgets a phone runs are the ones
          # built here. Only the SDK and the platform minimum differ.
          build() {
            local name="$1" sdk="$2" min="$3"
            local sysroot
            sysroot="$(xcrun --sdk "$sdk" --show-sdk-path)"

            cat >"$name.ini" <<EOF
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          ar = 'ar'
          strip = 'strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '$min']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '$min']
          cpp_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '$min']
          cpp_link_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '$min']

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

            meson setup "build-$name" . -Dguest_arch=arm64 --buildtype=release \
              --cross-file "$name.ini"
            # Named targets, not everything: tools/fakefsify links the host's
            # libarchive and cannot be built for a phone.
            ninja -C "build-$name" libish.a libish_emu.a libfakefs.a

            tar czf "ish-$name.tar.gz" -C "build-$name" \
              libish.a libish_emu.a libfakefs.a
          }

          build ios-arm64 iphoneos '-miphoneos-version-min=13.0'
          build iossim-arm64 iphonesimulator '-mios-simulator-version-min=13.0'

          # What a consumer checks before it links anything it downloaded.
          shasum -a 256 ish-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # The newest build of the default branch is a defensible thing for
          # "latest" to mean, now that the names sort. It was false while every
          # tag was a hash, on the reasoning that these are outputs for a
          # pinned revision and no one of them is newer in any useful sense —
          # true, and it left the badge on whichever release had it last.
          make_latest: true
          body: |
            Static libraries for `${{ github.sha }}`, built for arm64.

            | file | for |
            | --- | --- |
            | `ish-ios-arm64.tar.gz` | iOS device (`iphoneos`) |
            | `ish-iossim-arm64.tar.gz` | iOS simulator (`iphonesimulator`) |

            Each holds `libish.a`, `libish_emu.a` and `libfakefs.a`. Verify
            against `SHA256SUMS` before linking.
          files: |
            ish-ios-arm64.tar.gz
            ish-iossim-arm64.tar.gz
            SHA256SUMS
