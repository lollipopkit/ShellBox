name: CI

on:
  # Only main. A branch with an open pull request would otherwise run every job
  # twice — once for the push, once for the pull_request — against the same
  # commit, which is what the unfiltered `push:` inherited from upstream did.
  push:
      branches: [main]
  pull_request:
      branches: [main]

# There is no Linux job. It built the x86 guest on an x86 runner, and both
# halves of that are gone: the guest is AArch64, and the gadgets it dispatches
# to are native code for the host, so the host has to be arm64 too. An
# `ubuntu-24.04-arm` runner would build platform/linux.c again if that path
# ever needs covering.
jobs:
  # The host build. It used to be an xcodebuild of the iSH app; there is no app
  # here any more, and what an embedder gets is the meson build, so that is
  # what is proved.
  build-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install llvm lld ninja libarchive meson
      - name: Build
        run: |
          meson setup build
          ninja -C build
      - name: Test
        run: meson test -C build --print-errorlogs

      # Handed to the smoke job rather than run here, so that a guest that
      # fails to boot is its own red check instead of "build-mac failed".
      - name: Upload ish
        uses: actions/upload-artifact@v4
        with:
          name: ish-cli
          path: |
            build/ish
            build/sbm_api_test
          retention-days: 1

  # A guest that boots and answers correctly. Offline — see the header of
  # smoke.sh for why the gate does not install packages. The full matrix, which
  # does reach the network, is integration.yml: manual and nightly.
  smoke:
    needs: build-mac
    runs-on: macos-15
    # A guest that hangs would otherwise sit here until the runner's own limit,
    # which is a job that never reports rather than a test that failed.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ish-cli
          path: build
      # Keyed on the pinned digests, so the one network step this gate has does
      # not repeat on every run.
      - name: Cache rootfs tarballs
        uses: actions/cache@v4
        with:
          path: build/integration/*.tar.*
          key: rootfs-${{ hashFiles('tests/integration/rootfs.sh') }}
      - name: Integration (smoke)
        run: |
          chmod +x build/ish build/sbm_api_test
          tests/integration/smoke.sh -i build/ish

  # What ServerBox links, built the way it builds it: a cross build for the
  # device SDK, of the three library targets and nothing else. `tools/fakefsify`
  # links the host's libarchive and cannot be built for a phone, so `ninja` with
  # no target would fail here.
  build-ios-libs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install llvm lld ninja libarchive meson
      - name: Build
        run: |
          sysroot="$(xcrun --sdk iphoneos --show-sdk-path)"
          cat > ios.ini <<EOF
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          ar = 'ar'
          strip = 'strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '-miphoneos-version-min=13.0']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '-miphoneos-version-min=13.0']
          cpp_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '-miphoneos-version-min=13.0']
          cpp_link_args = ['-arch', 'arm64', '-isysroot', '$sysroot', '-miphoneos-version-min=13.0']

          [host_machine]
          system = 'darwin'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF
          meson setup build-ios . -Dguest_arch=arm64 --buildtype=release --cross-file ios.ini
          ninja -C build-ios libish.a libish_emu.a libfakefs.a
